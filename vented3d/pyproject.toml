[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vented3d-native"
version = "0.1.0"
description = "Independent mixed-element FEM-shell-BEM vented enclosure solver"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.12", "meshio>=5.3", "matplotlib>=3.7"]

[project.optional-dependencies]
mkl = ["py-mkl-pardiso==0.0.6"]

[project.scripts]
vented3d = "vented3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
